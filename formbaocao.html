<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Báo cáo thí nghiệm hóa vô cơ</title>
  <style>
    @page{size:A4 landscape;margin:16mm}
    *{box-sizing:border-box}
    body{margin:0 auto;max-width:1180px;padding:32px;color:#111;font:15px/1.45 "Times New Roman",serif}
    h1{margin:0;text-align:center;font-size:21px}
    .semester{margin:8px 0 20px;text-align:center;font-weight:bold}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:7px 24px;margin:0 0 22px}
    table{width:100%;border-collapse:collapse;table-layout:fixed}
    th,td{border:1px solid #222;padding:8px;vertical-align:top;overflow-wrap:anywhere}
    th{background:#e8edf3;text-align:center}
    th:nth-child(1){width:13%}th:nth-child(2){width:27%}th:nth-child(3){width:30%}th:nth-child(4){width:30%}
    .report-photo{margin:8px 0}
    .report-photo img{display:block;max-width:100%;max-height:220px;object-fit:contain}
    .report-photo a{display:inline-block;margin-top:3px;font-size:12px}
    @media(max-width:700px){body{padding:14px;overflow-x:auto;min-width:720px}}
  </style>
</head>
<body>
  <h1>BÁO CÁO THÍ NGHIỆM HÓA VÔ CƠ</h1>
  <p class="semester">{{SEMESTER}}</p>
  <div class="meta">
    <div>HỌ VÀ TÊN: {{STUDENT_NAME}}</div>
    <div>MSSV: {{STUDENT_ID}}</div>
    <div>NHÓM: {{GROUP}}</div>
    <div>BÀI SỐ: {{EXPERIMENT}}</div>
    <div>NGÀY: {{REPORT_DATE}}</div>
    <div>GVGD: TS. NGUYỄN BÌNH NGUYÊN</div>
  </div>
  <table>
    <thead>
      <tr>
        <th>TN</th>
        <th>CÁC BƯỚC TIẾN HÀNH</th>
        <th>HIỆN TƯỢNG QUAN SÁT THỰC TẾ</th>
        <th>GIẢI THÍCH VÀ PTPƯ MINH HỌA</th>
      </tr>
    </thead>
    <tbody>{{REPORT_ROWS}}</tbody>
  </table>
</body>
</html>
