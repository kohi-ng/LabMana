<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <title>Báo cáo thí nghiệm hóa vô cơ</title>
  <style>
    @page{size:A4 landscape;margin:16mm}
    *{box-sizing:border-box}
    body{margin:0 auto;max-width:1180px;padding:32px;color:#111;font:15px/1.45 "Times New Roman",serif}
    h1{margin:0;text-align:center;font-size:21px;font-weight:normal}
    .semester{margin:8px 0 20px;text-align:center}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:7px 24px;margin:0 0 22px}
    table{width:100%;border-collapse:collapse;table-layout:fixed}
    th,td{border:1px solid #222;padding:8px;vertical-align:top;overflow-wrap:anywhere}
    th{background:#e8edf3;text-align:center;font-weight:bold}
    th:nth-child(1){width:13%}th:nth-child(2){width:27%}th:nth-child(3){width:30%}th:nth-child(4){width:30%}
    /* Bảng Markdown lồng trong các ô báo cáo */
    .table-scroll{max-width:100%;overflow-x:auto;margin:8px 0}
    table.text-table{width:100%;table-layout:auto;border-collapse:collapse;font-size:13px}
    .text-table th,.text-table td{width:auto!important;min-width:72px;padding:5px 7px;border:1px solid #777;vertical-align:top;overflow-wrap:anywhere}
    .text-table th{background:#e8edf3;text-align:center}
    .text-table tr:nth-child(even) td{background:#f7f8fa}
    .report-photo{margin:8px 0}
    .report-photo img{display:block;max-width:100%;max-height:220px;object-fit:contain}
    .report-photo a{display:inline-block;margin-top:3px;font-size:12px}
    @media(max-width:700px){body{padding:14px;overflow-x:auto;min-width:720px}}
  </style>
</head>
<body>
  <h1>BÁO CÁO THÍ NGHIỆM HÓA VÔ CƠ</h1>
  <p class="semester">{{SEMESTER}}</p>
  <div class="meta">
    <div class="people"><div>HỌ VÀ TÊN - MSSV:</div>{{PEOPLE}}</div>
    <div>NHÓM: {{GROUP}}</div>
    <div><strong>{{EXPERIMENT}}</strong></div>
    <div>NGÀY: {{REPORT_DATE}}</div>
    <div>GVGD: TS. NGUYỄN BÌNH NGUYÊN</div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Thí nghiệm</th>
        <th>Các bước tiến hành</th>
        <th>Hiện tượng quan sát thực tế</th>
        <th>Giải thích và PTPƯ minh họa</th>
      </tr>
    </thead>
    <tbody>{{REPORT_ROWS}}</tbody>
  </table>
</body>
</html>
