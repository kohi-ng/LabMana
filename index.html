<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>LabMana</title>

  <!-- KaTeX + mhchem (công thức & phương trình hóa học) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="css/style.css">

  <!-- Các script "defer" chạy đúng thứ tự, TRƯỚC module js/app.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>LabMana</div>
    <div class="topbar-actions">
      <div id="conn" class="conn"><span class="pip"></span>Đang kết nối</div>
      <button id="progress-menu-toggle" class="progress-menu-toggle" type="button" aria-expanded="false" aria-controls="progress-menu">Tiến trình</button>
    </div>
  </header>

  <aside id="progress-menu" class="progress-menu" aria-label="Tiến trình thí nghiệm" hidden></aside>
  <div id="progress-backdrop" class="progress-backdrop"></div>
  <div id="banner" class="banner hidden"></div>

  <main id="app">
    <section id="tab-planner" class="tab" hidden></section>
    <section id="tab-sop" class="tab" hidden></section>
    <section id="tab-settings" class="tab" hidden></section>
  </main>

  <nav class="bottom-nav" aria-label="Điều hướng chính">
    <button data-tab="planner"><span>Kế hoạch</span></button>
    <button data-tab="sop"><span>Quy trình</span></button>
    <button data-tab="settings"><span>Cài đặt</span></button>
  </nav>

  <!-- Trạm pha chế: nút nổi góc màn hình, mở cửa sổ tra cứu nhanh — xem mọi tab -->
  <button id="calc-fab" class="calc-fab" aria-label="Mở trạm pha chế" title="Trạm pha chế">⚗️</button>
  <div id="calc-sheet-backdrop" class="calc-sheet-backdrop"></div>
  <div id="calc-sheet" class="calc-sheet" role="dialog" aria-modal="true" aria-label="Trạm pha chế">
    <div class="calc-sheet-head">
      <h3>⚗️ Trạm pha chế</h3>
      <button class="icon-btn" id="calc-sheet-close" aria-label="Đóng">✕</button>
    </div>
    <div class="calc-sheet-body" id="calc-sheet-body"></div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
