<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>LABMANA</title>

  <!-- KaTeX + mhchem (công thức & phương trình hóa học) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <!-- Intro chỉ chạy ở phiên mới (tab/cửa sổ mới); tải lại trong cùng phiên thì bỏ qua -->
  <script>try{if(!sessionStorage.getItem("labmana.intro")){sessionStorage.setItem("labmana.intro","1");document.documentElement.classList.add("intro-on");}}catch(e){}</script>

  <!-- Các script "defer" chạy đúng thứ tự, TRƯỚC module js/app.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <!-- Mô phỏng 3D (Bước 4/4 tab Pha chế): Three.js + GSAP 3, đều có trong pre-cache của sw.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body>
  <div id="intro" aria-hidden="true"><canvas></canvas><div class="intro-logo">LABMANA</div></div>
  <script src="js/intro.js"></script>
  <header class="topbar">
    <button id="progress-menu-toggle" class="brand brand-btn" type="button" aria-expanded="false" aria-controls="progress-menu" aria-label="LABMANA — mở tiến trình">
      <span>LABMANA</span><span class="chev" aria-hidden="true"></span>
    </button>
    <nav class="topbar-actions" aria-label="Kế hoạch và cài đặt">
      <button type="button" class="top-tab" data-tab="planner">Kế hoạch</button>
      <button type="button" class="top-tab" data-tab="settings">Cài đặt</button>
    </nav>
  </header>

  <aside id="progress-menu" class="progress-menu" aria-label="Tiến trình" hidden></aside>
  <div id="progress-backdrop" class="progress-backdrop"></div>
  <div id="banner" class="banner hidden"></div>

  <main id="app">
    <section id="tab-planner" class="tab" hidden></section>
    <section id="tab-sop" class="tab" hidden></section>
    <section id="tab-calc" class="tab" hidden></section>
    <section id="tab-ai" class="tab" hidden></section>
    <section id="tab-settings" class="tab" hidden></section>
  </main>

  <nav class="bottom-nav" aria-label="Điều hướng chính">
    <button data-tab="sop">Quy trình</button>
    <button data-tab="calc">Pha chế</button>
    <button data-tab="ai">AI</button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
